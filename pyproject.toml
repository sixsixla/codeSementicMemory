[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-semantic-memory"
version = "0.1.0"
description = "SQLite-first persistent coding memory for vibe coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CodeSementicMemory contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1"
]

[project.scripts]
codememory = "codememory.cli:main"
codememory-replay = "codememory.cli:replay_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"migrations" = ["migrations/*.sql"]
"schemas" = ["schemas/*.json"]
"web" = ["web/index.html", "web/styles.css", "web/app.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
